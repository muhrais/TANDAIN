# Blueprint Render untuk TANDAIN (opsi B: cloud).
# Satu web service: build dashboard (frontend/dist) lalu Express melayani API
# + dashboard di satu alamat. Database di MongoDB Atlas (bukan di Render).
# Panduan lengkap: docs/DEPLOY_CLOUD.md
services:
  - type: web
    name: tandain
    runtime: node
    plan: free
    region: singapore
    # --include=dev: vite & plugin ada di devDependencies frontend; tanpa ini
    # build gagal karena NODE_ENV=production melewati devDependencies.
    buildCommand: npm ci && npm ci --prefix frontend --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_API_KEY
        generateValue: true
      # Diisi manual di dashboard Render (rahasia, tidak di-commit):
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
